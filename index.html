<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Приключения Эритро</title>
<style>
:root{
 --red:#ef476f;
 --blue:#5271e8;
 --purple:#7654ce;
 --ink:#283251;
 --muted:#68738d;
 --green:#20a77b;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:var(--ink);
 background:linear-gradient(135deg,#e9efff,#fff0f5);
 min-height:100vh;
}
.app{max-width:900px;margin:auto;padding:18px}
header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:15px;flex-wrap:wrap;
}
.logo{font-weight:900;color:#744bc8;font-size:22px}
.card{
 background:white;border-radius:25px;padding:28px;
 box-shadow:0 12px 35px #7777aa22;margin-bottom:16px;
}
h1,h2,h3{color:#373d74}
h1{font-size:clamp(27px,5vw,43px);margin:10px 0}
h2{font-size:26px}
p{line-height:1.65}
.tag{
 display:inline-block;background:#f1eaff;color:#7850c7;
 border-radius:30px;padding:8px 15px;font-weight:bold;
}
.btn{
 border:0;border-radius:15px;padding:15px 22px;
 font-size:16px;font-weight:bold;cursor:pointer;
 background:linear-gradient(110deg,#6276ec,#9659d8);
 color:white;transition:.2s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#eef0ff;color:#655ac5}
.choice{
 display:block;width:100%;text-align:left;margin:11px 0;
 padding:17px;border-radius:15px;
 background:#f7f8ff;border:2px solid #e4e6f5;
 font-size:16px;color:#303b5d;cursor:pointer;
}
.choice:hover{border-color:#9982ef}
.choice.selected{border-color:#7953de;background:#eee8ff;font-weight:bold}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.stat{
 background:white;border-radius:13px;
 padding:11px 14px;flex:1;min-width:120px;
 box-shadow:0 3px 12px #7777aa18;
 font-weight:bold;text-align:center;
}
.progress{
 background:#e9eafa;border-radius:20px;height:11px;
 overflow:hidden;margin:14px 0;
}
.fill{
 height:100%;background:linear-gradient(90deg,#ed6887,#8762dc);
 transition:width .35s;
}
.scene{
 min-height:225px;border-radius:22px;
 background:linear-gradient(135deg,#fff1f6,#e9edff);
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;margin:20px 0;position:relative;
}
.scene svg{width:100%;height:auto;max-height:290px}
.speech{
 background:#f4f5ff;border-left:5px solid #8c70df;
 padding:16px;border-radius:10px;margin:16px 0;
 line-height:1.6;
}
.feedback{
 background:#effaf5;padding:17px;border-radius:15px;
 margin:15px 0;line-height:1.65;
}
.warning{background:#fff2e9}
.map{
 background:#f7f9ff;border-radius:20px;padding:15px;
 overflow:auto;
}
.map svg{display:block;max-width:100%;height:auto;margin:auto}
.small{font-size:14px;color:var(--muted)}
.hidden{display:none!important}
.emphasis{color:#e84670;font-weight:bold}
footer{text-align:center;font-size:12px;color:#8890a9;margin:25px}
@media(max-width:540px){
 .card{padding:19px}
 .btn{width:100%}
 .scene{min-height:170px}
 h2{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">🩸 Приключения Эритро</div>
 <button class="btn secondary" id="mapBtn">🫀 Карта кровообращения</button>
</header>

<div id="stats" class="stats hidden"></div>
<div id="progress" class="progress hidden"><div id="bar" class="fill"></div></div>
<main id="screen" aria-live="polite"></main>
<footer>Биология • 7 класс • Большой и малый круги кровообращения</footer>
</div>

const branches={

 },

 },

 explanation:"Правый желудочек начинает малый круг и направляет кровь к лёгким. Левый желудочек начинает большой круг и направляет кровь в аорту."
 }
};

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
const $=id=>document.getElementById(id);

function playTone(freq=550){
 if(!sound)return;
 try{
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const osc=ctx.createOscillator();
 const gain=ctx.createGain();
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(.045,ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);
 osc.connect(gain).connect(ctx.destination);
 osc.start();osc.stop(ctx.currentTime+.17);
 osc.onended=()=>ctx.close();
 }catch(e){}
}

}

function art(type,mood){
 if(type==="heart"||type==="lungs"||type==="organs"){
 const icons={heart:"❤️",lungs:"🫁",organs:"🧬"};
 return `<div style="text-align:center;width:100%">
 <div style="font-size:50px;margin-top:12px">${icons[type]}</div>
 ${erythro(mood)}
 </div>`;
 }
 return erythro(mood);
}

function updateStats(){
 const active=state.screen!=="start";
 $("stats").classList.toggle("hidden",!active);
 $("progress").classList.toggle("hidden",!active);
 if(!active)return;
 $("stats").innerHTML=`
 <div class="stat">❤️ Энергия: ${state.energy}%</div>
 <div class="stat">🧠 Знания: ${state.knowledge}/120</div>
 <div class="stat">🩸 Этап: ${Math.min(state.stage+1,6)}/6</div>`;
 $("bar").style.width=(state.history.length/6*100)+"%";
}
function render(html){
 $("screen").innerHTML=html;
 updateStats();
 window.scrollTo({top:0,behavior:"instant"});
}
function start(){
 state=initial();
 state.screen="game";
 showScene();
 playTone(660);
}
function showStart(){
 state.screen="start";
 render(`<section class="card" style="text-align:center">
 <span class="tag">Интерактивное приключение • Биология, 7 класс</span>
 <h1>🩸 Приключения Эритро</h1>
 <h3>Большое путешествие маленькой клетки</h3>
 <div class="scene">${erythro("happy")}</div>
 <div class="speech" style="text-align:left">
 «Привет! Я Эритро — маленький эритроцит! Сегодня мне предстоит
 пройти через сердце, побывать в лёгких, получить кислород
 и доставить его клеткам организма.<br><br>
 Но я запутался в двух кругах кровообращения!
 Поможешь мне найти правильный путь?»
 </div>
 <p>❤️ Энергия: 100% &nbsp; 🧠 Знания: 0 &nbsp; 🩸 6 этапов</p>
 <p class="small">Время прохождения: примерно 5–7 минут.</p>
 <button class="btn" onclick="start()">🚀 НАЧАТЬ ПУТЕШЕСТВИЕ</button>
 </section>`);
}
function showScene(){
 if(state.energy<=0){finish();return;}
 if(state.stage>=scenes.length){finish();return;}
 state.screen="game";
 state.selected=null;
 const s=scenes[state.stage];
 render(`<section class="card">
 <span class="tag">Этап ${state.stage+1} из 6</span>
 <h2>${s.title}</h2>
 <p class="small">📍 ${s.place}</p>
 <div class="scene">${art(s.vessel,"happy")}</div>
 <div class="speech">🩸 <b>Эритро:</b> ${s.text}</div>
 <h3>❓ ${s.question}</h3>
 <div id="choices">
 ${s.choices.map((c,i)=>`
 <button class="choice" onclick="selectAnswer(${i})" data-choice="${i}">
 ${String.fromCharCode(65+i)}. ${c}</button>`).join("")}
 </div>
 <button class="btn" id="confirm" disabled onclick="confirmAnswer()">Подтвердить выбор</button>
 </section>`);
}
function selectAnswer(i){
 state.selected=i;
 document.querySelectorAll(".choice").forEach((b,j)=>{
 b.classList.toggle("selected",i===j);
 b.setAttribute("aria-pressed",i===j?"true":"false");
 });
 $("confirm").disabled=false;
}
function confirmAnswer(){
 if(state.selected===null)return;
 const s=scenes[state.stage],a=state.selected;
 const type=a===2?"hint":a===s.correct?"correct":"wrong";
 const delta=type==="correct"?20:type==="hint"?10:0;
 const loss=type==="wrong"?20:type==="hint"?10:0;
 state.knowledge+=delta;
 state.energy=Math.max(0,state.energy-loss);
 state.history.push({
 stage:state.stage,
 title:s.title,
 type:type,
 answer:s.choices[a],
 knowledge:delta,
 energy:-loss
 });
 state.outcome={type,text:type==="correct"?s.good:type==="hint"?s.hint:s.wrong,delta,loss};
 state.branch=type==="wrong"?s.branch:null;
 state.screen="outcome";
 showOutcome();
 playTone(type==="correct"?780:type==="hint"?550:280);
}
function showOutcome(){
 const o=state.outcome;
 const headline=o.type==="correct"?"🌟 Отличное решение!":
 o.type==="hint"?"💡 Подсказка Эритро":"🧭 Разберём маршрут";
 render(`<section class="card">
 <span class="tag">Последствия решения</span>
 <h2>${headline}</h2>
 <div class="scene">${erythro(o.type==="correct"?"celebrate":o.type==="hint"?"think":"worried")}</div>
 <div class="feedback ${o.type==="wrong"?"warning":""}">${o.text}</div>
 <div class="stats">
 <div class="stat">🧠 ${o.delta?`+${o.delta} знаний`:"+0 знаний"}</div>
 <div class="stat">❤️ ${o.loss?`−${o.loss} энергии`:"Без потерь"}</div>
 </div>
 <p>${state.energy===0?
 "Энергия закончилась. Экспедиция завершается, и мы подведём итоги.":
 state.branch?"Эритро предстоит разобраться в дополнительной ситуации.":
 "Эритро изучил правильный маршрут и готов продолжать путешествие."}</p>
 <button class="btn" onclick="nextAfterOutcome()">Продолжить ➜</button>
 </section>`);
}
function nextAfterOutcome(){
 if(state.energy<=0){finish();return;}
 if(state.branch){showBranch();return;}
 state.stage++;
 showScene();
}
function showBranch(){
 state.screen="branch";
 const b=branches[state.branch];
 render(`<section class="card">
 <span class="tag">🌳 Дополнительная сюжетная ветка</span>
 <h2>${b.title}</h2>
 <div class="scene">${erythro("think")}</div>
 <div class="speech">${b.text}</div>
 <div class="feedback">${b.explanation}</div>
 <p>Теперь мы знаем, как устроен этот участок кровообращения. Возвращаемся к основному маршруту!</p>
 <button class="btn" onclick="exitBranch()">Вернуться к путешествию ➜</button>
 </section>`);
}
function exitBranch(){
 state.branch=null;
 state.stage++;
 showScene();
}
function finish(){
 state.screen="final";
 const k=state.knowledge,e=state.energy;
 let level;
 if(e===0||k<50)level=0;
 else if(k>=100)level=2;
 else level=1;
 const endings=[
 {
 title:"🧭 Эритро нужна помощь!",
 mood:"worried",
 story:"Эритро останавливается перед большой схемой кровеносной системы. «Кажется, мы слишком часто путали маршруты! Но теперь я понимаю, что нужно сделать: ещё раз изучить путь крови через сердце, лёгкие и органы. Давай посмотрим на карту и попробуем снова!» Экспедиция пока не завершена самостоятельно, но новые знания помогут при следующей попытке."
 },
 {
 title:"⭐ Молодой исследователь",
 mood:"happy",
 story:"Эритро облегчённо улыбается. «Какое непростое приключение! Несколько раз мы путали сосуды и камеры сердца, но подсказки помогли разобраться. Теперь я знаю: малый круг проходит через лёгкие, а большой доставляет кислород органам. В следующий раз попробуем пройти маршрут ещё увереннее!»"
 },
 {
 title:"🏆 Герой кровообращения!",
 mood:"celebrate",
 story:"Эритро радостно кружится среди других эритроцитов! «Мы сделали это! Я побывал в лёгких, получил кислород, доставил его клеткам и вернулся в сердце! Теперь я знаю, как устроены оба круга кровообращения!» Сердце продолжает ритмично сокращаться, и начинается новое путешествие."
 }
 ];
 const f=endings[level];
 const weak=state.history.filter(x=>x.type!=="correct");
 let feedback=weak.length?
 `<h3>📚 Что стоит повторить</h3><ul>${weak.map(x=>
 `<li>${escapeHTML(x.title)}: ${x.type==="hint"?"использована подсказка":"маршрут выбран неверно"}.</li>`).join("")}</ul>`:
 "<p>Все основные маршруты определены без ошибок и подсказок!</p>";
 if(state.history.length<6)
 feedback+=`<p>Пройдено ${state.history.length} из 6 этапов. Часть маршрута осталась неизученной.</p>`;
 render(`<section class="card" style="text-align:center">
 <span class="tag">Финал приключения</span>
 <h1>${f.title}</h1>
 <div class="scene">${erythro(f.mood)}</div>
 <div class="speech" style="text-align:left">${f.story}</div>
 <div class="stats">
 <div class="stat">❤️ ${e}% энергии</div>
 <div class="stat">🧠 ${k}/120 знаний</div>
 <div class="stat">🩸 ${state.history.length}/6 этапов</div>
 </div>
 <div style="text-align:left">
 <h3>🗺️ Маршрут путешествия</h3>
 <p>${state.history.map((x,i)=>`${i+1}. ${escapeHTML(x.title)} ${
 x.type==="correct"?"✅":x.type==="hint"?"💡":"⚠️"
 }`).join("<br>")}</p>
 ${feedback}
 <div class="feedback">
 <b>Малый круг:</b> правый желудочек → лёгочные артерии → лёгкие → лёгочные вены → левое предсердие.<br><br>
 <b>Большой круг:</b> левый желудочек → аорта → органы и ткани → полые вены → правое предсердие.
 </div></div>
 <div class="row" style="justify-content:center">
 <button class="btn" onclick="start()">🔄 Пройти ещё раз</button>
 <button class="btn secondary" onclick="showMap()">🫀 Посмотреть карту</button>
 </div>
 </section>`);
}
function showMap(){
 const previous=state.screen;
 const old=$("screen").innerHTML;
 const oldStats=$("stats").innerHTML;
 const oldBar=$("bar").style.width;
 render(`<section class="card">
 <h2>🫀 Карта кровообращения</h2>
 <p>Проследи направление движения крови по стрелкам.</p>
 <div class="map">${diagram()}</div>
 <div class="feedback">
 <b>Малый круг:</b> правый желудочек → лёгкие → левое предсердие.
 Здесь кровь обогащается кислородом.<br><br>
 <b>Большой круг:</b> левый желудочек → органы → правое предсердие.
 Здесь кровь отдаёт кислород тканям.
 </div>
 <p class="small">Красным показана кровь, богатая кислородом, синим — с низким его содержанием. Это условные цвета схемы: настоящая венозная кровь не синяя.</p>
 <button class="btn" id="backMap">← Вернуться к игре</button>
 </section>`);
 $("backMap").onclick=()=>{
 state.screen=previous;
 $("screen").innerHTML=old;
 $("stats").innerHTML=oldStats;
 $("bar").style.width=oldBar;
 updateStats();
 };
}
$("mapBtn").onclick=showMap;
showStart();
</script>
</body>
</html>
